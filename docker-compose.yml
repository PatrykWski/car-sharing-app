services:
  mysql:
    image: mysql:8.0
    platform: linux/amd64
    restart: unless-stopped
    env_file: ./.env
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      - MYSQL_USER=${MYSQLDB_USER}
      - MYSQL_PASSWORD=${MYSQLDB_PASSWORD}
      - MYSQL_DATABASE=${MYSQLDB_DATABASE}
      - MYSQL_ROOT_PASSWORD=${MYSQLDB_ROOT_PASSWORD}
    ports:
      - "${MYSQLDB_LOCAL_PORT:-3306}:${MYSQLDB_DOCKER_PORT:-3306}"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  app:
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure
    image: car-sharing-app
    build: .
    env_file: ./.env
    ports:
      - "${SPRING_LOCAL_PORT:-8080}:${SPRING_DOCKER_PORT:-8080}"
      - "${DEBUG_PORT:-5005}:${DEBUG_PORT:-5005}"
    environment:
      - spring.datasource.url=jdbc:mysql://mysql:${MYSQLDB_DOCKER_PORT}/${MYSQLDB_DATABASE}
      - spring.datasource.username=${MYSQLDB_USER}
      - spring.datasource.password=${MYSQLDB_PASSWORD}
      - spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      - spring.datasource.hikari.initialization-fail-timeout=-1

volumes:
  mysql-data: